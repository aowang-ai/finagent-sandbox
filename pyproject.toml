[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent-sandbox"
version = "0.1.0"
description = "FinAgentSandbox: pluggable harness × sandbox × community finance benches (HarnessFactory / BenchFactory / PluginFactory)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.scripts]
finagent-eval = "finagent.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["finagent*", "adapters*"]
exclude = ["modules*", "scripts*", "docs*", "tests*", "cli*"]
